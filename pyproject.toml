[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-native-crm"
version = "0.1.0"
description = "AI-Native CRM Agent with Zero-DB Architecture. Redis-only persistence, CRM API as source of truth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "AI-Native CRM Contributors" },
]
keywords = ["crm", "ai", "agent", "redis", "telegram", "bitrix24", "amocrm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "aiogram>=3.10,<4",
    "aiohttp>=3.9",
    "tiktoken>=0.7",
    "openai>=1.0",
    "anthropic>=0.25",
    "python-dotenv>=1.0",
    "redis[hiredis]>=5.0",
    "pydantic-settings>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis[lua]>=2.20",
    "lupa>=2.0",
]

[project.scripts]
ai-crm = "ai_native_crm.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR/ai-native-crm"
Documentation = "https://github.com/YOUR/ai-native-crm#readme"
Repository = "https://github.com/YOUR/ai-native-crm"
Issues = "https://github.com/YOUR/ai-native-crm/issues"

[tool.hatch.build.targets.wheel]
packages = ["ai_native_crm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ai_native_crm/tests"]
