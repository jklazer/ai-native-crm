name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check ai_native_crm/

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
          TELEGRAM_TOKEN: "fake:token"
          OPENAI_API_KEY: "sk-fake"
          CRM_ADAPTER: mock
        run: |
          python -m pytest ai_native_crm/tests/ -v --tb=short
